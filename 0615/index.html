<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動數字抽籤 V2 - 連續抽籤</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="landing-page">
        <div class="card">
            <h1>神奇數字抽籤機 V2</h1>
            <p class="instructions">
                <strong>【互動說明】</strong><br>
                1. 在下方輸入想要「連續抽取」的次數。<br>
                2. 進入後，<strong>點擊滑鼠左鍵</strong>會依序凍結並產生數字。<br>
                3. 畫面下方會記錄你連續抽出的所有號碼！
            </p>
            
            <div class="input-group">
                <label for="draw-count">抽取次數：</label>
                <input type="number" id="draw-count" min="1" max="20" value="3">
            </div>

            <button id="start-btn">開始抽籤</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
